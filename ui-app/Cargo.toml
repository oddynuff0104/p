[package]
name = "poly-ui-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Standalone window for the poly UI kit (Win32 + D3D11 + DirectComposition on Windows, AppKit + Metal on macOS)"
publish = false

[dependencies]
poly-ui = { path = "../ui" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString", "NSThread", "NSTimer", "NSUserDefaults"] }
objc2-app-kit = { workspace = true, features = ["NSAlert", "NSApplication", "NSColor", "NSCursor", "NSEvent", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSTrackingArea", "NSView", "NSWindow", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-metal = { workspace = true, features = ["MTLCommandBuffer", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLPixelFormat", "MTLTexture"] }
objc2-quartz-core = { workspace = true, features = ["CADisplayLink", "CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGColorSpace"] }

[lints]
workspace = true
