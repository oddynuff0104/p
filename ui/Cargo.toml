[package]
name = "poly-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Poly UI kit: immediate-mode widgets, theme, draw lists and the D3D11 (Windows) and Metal (macOS) renderers"
publish = false

[dependencies]
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSError", "NSString"] }
objc2-metal = { workspace = true, features = ["MTLAllocation", "MTLArgument", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLSampler", "MTLTexture", "MTLTypes"] }

[lints]
workspace = true
